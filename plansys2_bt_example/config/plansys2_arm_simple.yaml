# PlanSys2 for the assembly with arms, executing with SimpleBTBuilder
planner_client:
  ros__parameters:
    plan_solver_timeout: 15.0
planner:
  ros__parameters:
    plan_solver_timeout: 15.0
    plan_solver_plugins: ["POPF"]
    POPF:
      plugin: "plansys2/POPFPlanSolver"
executor:
  ros__parameters:
    bt_builder_plugin: "SimpleBTBuilder"
