launch:
- arg:
    name: namespace
    default: ''
    description: Namespace
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_bt_example)/pddl/bt_example.pddl}
    # Groot2 shows the behavior tree of the plan as it runs
    - {name: enable_groot_monitoring, value: 'true'}
    - {name: namespace, value: $(var namespace)}
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: move_1
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: move}
    - {name: enable_groot_monitoring, value: true}
    - {name: server_port, value: 1700}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/move.xml}
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: move_2
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: move}
    - {name: enable_groot_monitoring, value: true}
    - {name: server_port, value: 1702}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/move.xml}
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: move_3
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: move}
    - {name: enable_groot_monitoring, value: true}
    - {name: server_port, value: 1704}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/move.xml}
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: transport_1
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: transport}
    - {name: enable_groot_monitoring, value: true}
    - {name: server_port, value: 1706}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/transport.xml}
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: transport_2
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: transport}
    - {name: enable_groot_monitoring, value: true}
    - {name: server_port, value: 1708}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/transport.xml}
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: transport_3
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: transport}
    - {name: enable_groot_monitoring, value: true}
    - {name: server_port, value: 1710}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/transport.xml}
- node:
    pkg: plansys2_bt_example
    exec: assemble_action_node
    name: assemble_1
    namespace: $(var namespace)
    output: screen
- node:
    pkg: plansys2_bt_example
    exec: assemble_action_node
    name: assemble_2
    namespace: $(var namespace)
    output: screen
- node:
    pkg: plansys2_bt_example
    exec: assemble_action_node
    name: assemble_3
    namespace: $(var namespace)
    output: screen
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: recharge_1
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: recharge}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/recharge.xml}
