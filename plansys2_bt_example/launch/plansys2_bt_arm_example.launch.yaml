# Assembly with arms: the same plan executed with SimpleBTBuilder or STNBTBuilder
# (bt_builder:=simple|stn) to compare how each one parallelizes it.

launch:
- arg:
    name: namespace
    default: ''
    description: Namespace
- arg:
    name: bt_builder
    default: stn
    description: 'Behavior tree builder that executes the plan: simple or stn'
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_bt_example)/pddl/bt_arm_example.pddl}
    # Groot2 shows the behavior tree of the plan as it runs
    - {name: enable_groot_monitoring, value: 'true'}
    - {name: namespace, value: $(var namespace)}
    - {name: params_file, value: $(find-pkg-share plansys2_bt_example)/config/plansys2_arm_$(var bt_builder).yaml}
# Navigation is simulated: neither a robot nor EasyNav has to run
- node:
    pkg: plansys2_bt_example
    exec: easynav_sim_node
    namespace: $(var namespace)
    output: screen
# Performers of robot 1; timed actions last as in the domain, in seconds
- node:
    pkg: plansys2_bt_actions
    exec: bt_action_node
    name: move_1
    namespace: $(var namespace)
    output: screen
    param:
    - from: $(find-pkg-share plansys2_bt_example)/config/params.yaml
    - {name: action_name, value: move}
    - {name: bt_xml_file, value: $(find-pkg-share plansys2_bt_example)/behavior_trees_xml/move.xml}
- node:
    pkg: plansys2_bt_example
    exec: timed_action_node
    name: approach_1
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: approach}
    - {name: duration, value: 3.0}
    - {name: rate, value: 10.0}
- node:
    pkg: plansys2_bt_example
    exec: timed_action_node
    name: prepare_pick_1
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: prepare_pick}
    - {name: duration, value: 3.0}
    - {name: rate, value: 10.0}
- node:
