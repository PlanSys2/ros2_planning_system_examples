    exec: timed_action_node
    name: pick_1
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: pick}
    - {name: duration, value: 2.0}
    - {name: rate, value: 10.0}
- node:
    pkg: plansys2_bt_example
    exec: timed_action_node
    name: prepare_release_1
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: prepare_release}
    - {name: duration, value: 3.0}
    - {name: rate, value: 10.0}
- node:
