launch:
- arg:
    name: namespace
    default: ''
    description: Namespace
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_simple_example_py)/pddl/simple_example.pddl}
    # Groot2 shows the behavior tree of the plan as it runs
    - {name: enable_groot_monitoring, value: 'true'}
    - {name: namespace, value: $(var namespace)}
- node:
    pkg: plansys2_simple_example_py
    exec: move_action_node
    name: move_action_node
    namespace: $(var namespace)
    output: screen
- node:
    pkg: plansys2_simple_example_py
    exec: charge_action_node.py
    name: charge_action_node
    namespace: $(var namespace)
    output: screen
- node:
    pkg: plansys2_simple_example_py
    exec: ask_charge_action_node
    name: ask_charge_action_node
    namespace: $(var namespace)
    output: screen
