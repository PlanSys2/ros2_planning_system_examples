launch:
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_patrol_navigation_example)/pddl/patrol.pddl}
    # Groot2 shows the behavior tree of the plan as it runs
    - {name: enable_groot_monitoring, value: 'true'}
# Simulated EasyNav: each navigation takes 10 s
- node:
    pkg: plansys2_bt_example
    exec: easynav_sim_node
    output: screen
- node:
    pkg: plansys2_patrol_navigation_example
    exec: move_action_node
    name: move_action_node
    output: screen
    param:
    - from: $(find-pkg-share plansys2_patrol_navigation_example)/params/waypoints_fakesim.yaml
- node:
    pkg: plansys2_patrol_navigation_example
    exec: patrol_action_node
    name: patrol_action_node
    output: screen
