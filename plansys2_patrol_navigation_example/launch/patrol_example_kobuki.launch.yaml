# Everything at once: the kobuki playground of easynav_playgrounds (Gazebo + EasyNav),
# PlanSys2 with the patrol actions, and the patrolling controller.

launch:
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}
- arg: {name: rviz, default: 'true', description: Start RViz2}
- include:
    file: $(find-pkg-share easynav_playground_kobuki)/launch/easynav_costmap_rpp.launch.yaml
    arg:
    - {name: gui, value: $(var gui)}
    - {name: rviz, value: $(var rviz)}
- include:
    file: $(find-pkg-share plansys2_patrol_navigation_example)/launch/patrol_example.launch.yaml
# Once PlanSys2 and EasyNav are up
- timer:
    period: 20.0
    children:
    - node:
        pkg: plansys2_patrol_navigation_example
        exec: patrolling_controller_node
        output: screen
