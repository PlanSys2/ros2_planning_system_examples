# EasyNav runs apart, e.g. the kobuki playground of easynav_playgrounds

launch:
- arg:
    name: waypoints_file
    default: $(find-pkg-share plansys2_patrol_navigation_example)/params/waypoints_kobuki.yaml
    description: Coordinates of the waypoints in the map of the robot
- arg:
    name: use_sim_time
    default: 'true'
    description: Use the simulation clock
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_patrol_navigation_example)/pddl/patrol.pddl}
- node:
    pkg: plansys2_patrol_navigation_example
    exec: move_action_node
    name: move_action_node
    output: screen
    param:
    - from: $(var waypoints_file)
    - {name: use_sim_time, value: $(var use_sim_time)}
- node:
    pkg: plansys2_patrol_navigation_example
    exec: patrol_action_node
    name: patrol_action_node
    output: screen
    param:
    - {name: use_sim_time, value: $(var use_sim_time)}
