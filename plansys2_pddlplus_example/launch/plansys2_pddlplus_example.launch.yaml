launch:
- arg:
    name: namespace
    default: ''
    description: Namespace
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_pddlplus_example)/pddl/greenhouse.pddl}
    - {name: problem_file, value: $(find-pkg-share plansys2_pddlplus_example)/pddl/watering.pddl}
    - {name: namespace, value: $(var namespace)}
- node:
    pkg: plansys2_pddlplus_example
    exec: timed_action_node
    name: move_action_node
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: move}
- node:
    pkg: plansys2_pddlplus_example
    exec: timed_action_node
    name: recharge_action_node
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: recharge}
- node:
    pkg: plansys2_pddlplus_example
    exec: timed_action_node
    name: open_valve_action_node
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: open_valve}
- node:
    pkg: plansys2_pddlplus_example
    exec: timed_action_node
    name: open_window_action_node
    namespace: $(var namespace)
    output: screen
    param:
    - {name: action_name, value: open_window}
