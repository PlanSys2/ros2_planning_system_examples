# One PlanSys2 against an enemy that holds still, found while fighting: the arbiter, PlanSys2, the
# performers and the controller of every army that plans, and RViz2 with the battle
launch:
- arg: {name: goal, default: capture, description: 'capture, or total (also destroy every enemy found)'}
- arg: {name: rviz, default: 'true', description: Show the battle in RViz2}
- arg: {name: shutdown_at_end, default: 'false', description: Stop everything when the battle ends}
- arg: {name: seed, default: '', description: 'Seed of the shots; by default, the world''s'}
- include:
    file: $(find-pkg-share plansys2_combat_example)/launch/combat_launch.py
    arg:
    - {name: world, value: fog_defense}
    - {name: goal, value: $(var goal)}
    - {name: rviz, value: $(var rviz)}
    - {name: seed, value: $(var seed)}
    - {name: shutdown_at_end, value: $(var shutdown_at_end)}
