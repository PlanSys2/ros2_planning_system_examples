# A big battle: two PlanSys2 with twelve robots each on a 6x6 map crossed by a river.
# The river runs between columns 2 and 3 and has two bridges, in rows 1 and 4; eight control
# points, in pairs on both banks. Blue starts at z2_0 and red at z3_5; each side sees only its
# base at the start; each side guards its central points with its tanks, which only tanks and
# artillery clear. Whoever holds every control point, or is the only one with robots left, wins
combat_arbiter:
  ros__parameters:
    seed: 3
    time_scale: 0.6  # real seconds per second of the plan: plans of a big battle take seconds
    zones:
      - "z0_0"
      - "z0_1"
      - "z0_2"
      - "z0_3"
      - "z0_4"
      - "z0_5"
      - "z1_0"
      - "z1_1"
      - "z1_2"
      - "z1_3"
      - "z1_4"
      - "z1_5"
      - "z2_0"
      - "z2_1"
      - "z2_2"
      - "z2_3"
      - "z2_4"
      - "z2_5"
      - "z3_0"
      - "z3_1"
      - "z3_2"
      - "z3_3"
      - "z3_4"
      - "z3_5"
      - "z4_0"
      - "z4_1"
      - "z4_2"
      - "z4_3"
      - "z4_4"
      - "z4_5"
      - "z5_0"
      - "z5_1"
      - "z5_2"
      - "z5_3"
      - "z5_4"
      - "z5_5"
    zone_positions:  # "zone x y", in meters on the map frame
      - "z0_0 0 50"
      - "z0_1 10 50"
      - "z0_2 20 50"
      - "z0_3 30 50"
      - "z0_4 40 50"
      - "z0_5 50 50"
      - "z1_0 0 40"
      - "z1_1 10 40"
      - "z1_2 20 40"
      - "z1_3 30 40"
      - "z1_4 40 40"
      - "z1_5 50 40"
      - "z2_0 0 30"
      - "z2_1 10 30"
      - "z2_2 20 30"
      - "z2_3 30 30"
      - "z2_4 40 30"
      - "z2_5 50 30"
      - "z3_0 0 20"
      - "z3_1 10 20"
      - "z3_2 20 20"
      - "z3_3 30 20"
      - "z3_4 40 20"
      - "z3_5 50 20"
