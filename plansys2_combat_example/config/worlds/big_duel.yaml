      - "z0_2"
      - "z0_3"
      - "z2_2"
      - "z2_3"
      - "z3_2"
      - "z3_3"
      - "z5_2"
      - "z5_3"
    # Every side: its base, its army and what it sees from the start (its base if not given)
    sides: ["blue", "red"]
    armies: ["blue", "red"]  # the sides that plan, each with its PlanSys2 (read by the launcher)
    rviz: "combat_big.rviz"  # the RViz2 configuration that frames this map (read by the launcher)
    viewpoint: ""  # in RViz, every robot solid: both sides play
    blue:
      base: "z2_0"
      robots:
        - "b_drone1 drone z2_0"
        - "b_drone2 drone z2_0"
        - "b_inf1 infantry z2_0"
        - "b_inf2 infantry z2_0"
        - "b_inf3 infantry z2_0"
        - "b_inf4 infantry z2_0"
        - "b_inf5 infantry z2_0"
        - "b_inf6 infantry z2_0"
        - "b_tank1 tank z2_2"  # the tanks guard the control points of the center
        - "b_tank2 tank z3_2"
        - "b_art1 artillery z2_0"
        - "b_art2 artillery z2_0"
    red:
      base: "z3_5"
      robots:
        - "r_drone1 drone z3_5"
        - "r_drone2 drone z3_5"
        - "r_inf1 infantry z3_5"
        - "r_inf2 infantry z3_5"
        - "r_inf3 infantry z3_5"
        - "r_inf4 infantry z3_5"
        - "r_inf5 infantry z3_5"
        - "r_inf6 infantry z3_5"
        - "r_tank1 tank z2_3"  # the tanks guard the control points of the center
        - "r_tank2 tank z3_3"
        - "r_art1 artillery z3_5"
        - "r_art2 artillery z3_5"
    hit_probability:
      - "infantry 0.7"
      - "tank 0.8"
      - "artillery 0.6"
