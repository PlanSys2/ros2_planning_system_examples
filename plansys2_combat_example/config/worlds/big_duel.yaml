      - "z5_1 10 0"
      - "z5_2 20 0"
      - "z5_3 30 0"
      - "z5_4 40 0"
      - "z5_5 50 0"
    water:  # "x1 y1 x2 y2 width", only drawn: the river between columns 2 and 3
      - "25 -6 25 56 3"
    connections:
      - "z0_0 z0_1 10"
      - "z0_0 z1_0 10"
      - "z0_1 z0_2 10"
      - "z0_1 z1_1 10"
      - "z0_2 z1_2 10"
      - "z0_3 z0_4 10"
      - "z0_3 z1_3 10"
      - "z0_4 z0_5 10"
      - "z0_4 z1_4 10"
      - "z0_5 z1_5 10"
      - "z1_0 z1_1 10"
      - "z1_0 z2_0 10"
      - "z1_1 z1_2 10"
