# PlanSys2 for the combat example in HDDL (hddl:=true): the bringup sets Klimax as the planner,
# and the HTN builder runs the plans by their decomposition.
# /**/ so that it applies to every side's PlanSys2, whatever its namespace
/**/plansys2:
  ros__parameters:
    use_real_time: false
/**/planner_client:
  ros__parameters:
    plan_solver_timeout: 15.0
/**/planner:
  ros__parameters:
    plan_solver_timeout: 15.0
/**/executor:
  ros__parameters:
    bt_builder_plugin: "HTNBTBuilder"
