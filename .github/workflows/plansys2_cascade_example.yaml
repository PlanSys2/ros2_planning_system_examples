name: plansys2_cascade_example

on:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy
  schedule:
      - cron: '0 0 * * 6'
      
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
      fail-fast: false
    steps:
      - name: Install popf deps
        run: sudo apt-get install libfl-dev
      - uses: actions/checkout@v2
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.1
        with:
          required-ros-distributions: jazzy
      - name: Install BT.CPP v4 and test_msgs (provisional Fix)
        run: sudo apt-get install ros-jazzy-behaviortree-cpp ros-jazzy-test-msgs
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.3.6
        with:
          package-name: plansys2_cascade_example
          target-ros2-distro: jazzy
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/plansys2.repos
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
