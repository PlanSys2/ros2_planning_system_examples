name: kilted

on:
  pull_request:
    branches:
      - kilted
  push:
    branches:
      - kilted
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - name: Install popf deps
        run: apt-get update && apt-get install -y libfl-dev
      - uses: actions/checkout@v4
        with:
          ref: kilted
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.15
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.5
        with:
          package-name: plansys2_bt_example plansys2_cascade_example plansys2_multidomain_example plansys2_patrol_navigation_example plansys2_simple_example
          target-ros2-distro: rolling
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/plansys2.repos
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
