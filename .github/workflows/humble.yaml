name: humble

on:
  pull_request:
    branches:
      - humble
  push:
    branches:
      - humble
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:jammy
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
      - name: Install popf deps
        run: apt-get update && apt-get install -y libfl-dev
      # There is no setup-ros image of Humble: setup-ros installs it
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.19
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: plansys2_bt_example plansys2_cascade_example plansys2_combat_example plansys2_multidomain_example plansys2_patrol_navigation_example plansys2_simple_example plansys2_simple_example_py
          target-ros2-distro: humble
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/plansys2.repos
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          file: ros_ws/lcov/total_coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
