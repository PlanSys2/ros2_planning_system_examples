launch:
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share plansys2_multidomain_example)/pddl_1/domain_1.pddl:$(find-pkg-share plansys2_multidomain_example)/pddl_2/domain_2.pddl}
    # Groot2 shows the behavior tree of the plan as it runs
    - {name: enable_groot_monitoring, value: 'true'}
- node:
    pkg: plansys2_multidomain_example
    exec: move_action_node
    name: move_action_node
    output: screen
- node:
    pkg: plansys2_multidomain_example
    exec: charge_action_node
    name: charge_action_node
    output: screen
- node:
    pkg: plansys2_multidomain_example
    exec: ask_charge_action_node
    name: ask_charge_action_node
    output: screen
- node:
    pkg: plansys2_multidomain_example
    exec: pick_object_action_node
    name: pick_object_action_node
    output: screen
- node:
    pkg: plansys2_multidomain_example
    exec: place_object_action_node
    name: place_object_action_node
    output: screen
